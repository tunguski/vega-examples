name: Deploy to GitHub Pages

# Builds the live Vega-Lite editor and publishes it to https://tunguski.github.io/vega-examples/.
#
# The app is compiled by the elm-lang CLI and embeds the elm-editor interpreter, so the workflow
# checks out both sibling repos and builds the elm-lang jar before running ./build.sh.
#
# One-time setup: in the repo's Settings → Pages, set "Source" to "GitHub Actions".

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent deployment; a newer push cancels an in-flight build.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out vega-examples
        uses: actions/checkout@v4

      - name: Check out elm-lang (the compiler)
        uses: actions/checkout@v4
        with:
          repository: tunguski/elm-lang
          path: .toolchain/elm-lang

      # elm-editor (the interpreter the app embeds) is a source dependency declared in
      # elm.vendored.json and cloned by the compiler at build time — no separate checkout needed.

      - name: Set up GraalVM for JDK 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: 'maven'

      - name: Build the elm-lang CLI (elm.jar)
        working-directory: .toolchain/elm-lang
        run: |
          chmod +x ./mvnw
          ./mvnw -B -ntp -DskipTests package

      - name: Build the editor
        run: |
          chmod +x ./build.sh
          ELM="java -jar $GITHUB_WORKSPACE/.toolchain/elm-lang/target/elm.jar" \
            ./build.sh

      # Stamp the short commit hash + UTC build time into a tiny fixed-position badge, so anyone can
      # glance at the live page and confirm which commit is deployed and when it was built. The badge
      # is appended to <html> (not <body>) by a small script, so it survives Elm taking over the body.
      # NOTE: perl uses -0777 (slurp the whole file as one record), NOT -0: compiled HTML can contain a
      # NUL byte, and -0 treats NUL as the record separator — which would split the file and double the
      # injection (once mid-runtime, corrupting it).
      - name: Stamp commit hash + build time into the footer
        run: |
          SHA=$(git rev-parse --short HEAD)
          WHEN=$(date -u '+%Y-%m-%d %H:%M UTC')
          export STAMP="built $WHEN · $SHA"
          echo "Stamping: $STAMP"
          find build -name '*.html' -print0 | xargs -0 -r perl -0777 -pi -e '
            my $t = $ENV{STAMP};
            my $s = "<script>(function(){function a(){"
                  . "if(document.getElementById(\"build-stamp\"))return;"
                  . "var d=document.createElement(\"div\");d.id=\"build-stamp\";d.textContent=\"$t\";"
                  . "d.title=\"deployed build\";"
                  . "d.style.cssText=\"position:fixed;bottom:4px;right:6px;z-index:2147483647;"
                  . "font:11px/1.45 ui-monospace,Menlo,Consolas,monospace;color:rgba(150,165,190,.72);"
                  . "background:rgba(8,12,18,.55);padding:2px 7px;border-radius:6px;pointer-events:none;"
                  . "letter-spacing:.02em\";(document.documentElement||document.body).appendChild(d);}"
                  . "if(document.readyState!=\"loading\")a();"
                  . "else document.addEventListener(\"DOMContentLoaded\",a);})();<\/script>";
            if    (s#</body>#$s</body>#) {}
            elsif (s#</html>#$s</html>#) {}
            else  { $_ .= $s }
          '

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
