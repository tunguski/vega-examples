<!DOCTYPE html>
<!-- data-theme=dark applies the editor shell's dark theme (the gallery sets this via theme.js; this
     standalone page sets it directly so the editor chrome matches the elm-lang editor). -->
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Elm · Vega-Lite editor</title>
    <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
    <!-- The reusable editor shell's chrome (file pane, code editing, Elm highlighting, resizable panes). -->
    <link rel="stylesheet" href="editor.css" />
    <style>
      /* The Vega editor's bits, layered on top of the editor shell (.ed-* / seg-* classes). */
      html, body { margin: 0; height: 100%; }
      #app { height: 100%; }

      /* The Vega preview pane: a white, scrollable chart surface filling the result column. */
      #vega-preview { height: 100%; min-height: 0; background: #fff; border-radius: 8px; padding: 16px; overflow: auto; }
      #vis { width: 100%; }
      .vega-err { color: #b00; white-space: pre-wrap; font-family: ui-monospace, monospace; }

      /* The chart Wizard source pane (rendered inside the shell's .ed-form-body). */
      .wiz-panel { padding: 14px; display: flex; flex-direction: column; gap: .8rem; }
      .wiz-field-label { font-size: .78rem; color: #9fb3c8; margin-bottom: .3rem; }
      .wiz-input, .wiz-csv { width: 100%; background: #0f1720; color: #e6edf3; border: 1px solid #2f3e54; border-radius: 6px; padding: .4rem; font: inherit; box-sizing: border-box; }
      .wiz-csv { font-family: ui-monospace, monospace; font-size: 12px; resize: vertical; }
      .wiz-twin { display: flex; gap: .5rem; }
      .wiz-twin > * { flex: 1; }
      .wiz-check { display: flex; align-items: center; gap: .3rem; font-size: .85rem; color: #e6edf3; cursor: pointer; padding: .3rem 0; }
      .wiz-advanced { border-top: 1px solid #2f3e54; padding-top: .6rem; margin-top: .2rem; display: flex; flex-direction: column; gap: .8rem; }
      .wiz-summary { cursor: pointer; color: #9fb3c8; font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; user-select: none; list-style: revert; }
      .wiz-summary:hover { color: #e6edf3; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="app.js"></script>
    <script>
      // The compiled app exposes its ports on window.$app (the elm-lang JS backend). On each spec it
      // emits, render it with vega-embed into the #vis element the app created (kept stable by lazy).
      // The shell may mount a tick after this script runs, so poll briefly until the port exists; any
      // spec emitted before we subscribe is buffered by the runtime and flushed on subscribe.
      (function wire() {
        if (!window.$app || !window.$app.ports || !window.$app.ports.renderSpec) {
          setTimeout(wire, 30);
          return;
        }
        window.$app.ports.renderSpec.subscribe(function (json) {
          var el = document.getElementById("vis");
          if (!el || !json) return;
          var spec;
          try { spec = JSON.parse(json); } catch (e) { return; }
          vegaEmbed(el, spec, { actions: true, renderer: "svg" }).catch(function (e) {
            el.innerHTML = '<pre class="vega-err">' + String(e) + "</pre>";
          });
        });
      })();
    </script>
  </body>
</html>
