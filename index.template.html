<!DOCTYPE html>
<!-- data-theme=dark applies the editor shell's dark theme (the gallery sets this via theme.js; this
     standalone page sets it directly so the editor chrome matches the elm-lang editor). -->
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Elm · Vega-Lite editor</title>
    <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
    <!-- The reusable editor shell's chrome (file pane, code editing, Elm highlighting, resizable panes). -->
    <link rel="stylesheet" href="editor.css" />
    <style>
      /* The Vega editor's bits, layered on top of the editor shell (.ed-* / seg-* classes). */
      html, body { margin: 0; height: 100%; }
      #app { height: 100%; }

      /* The Vega preview pane: a white, scrollable chart surface filling the result column. */
      #vega-preview { height: 100%; min-height: 0; background: #fff; border-radius: 8px; padding: 16px; overflow: auto; }
      #vis { width: 100%; }
      .vega-err { color: #b00; white-space: pre-wrap; font-family: ui-monospace, monospace; }

      /* New-chart wizard (rendered by VegaPreview; position:fixed so it overlays the whole window). */
      .vega-result { height: 100%; min-height: 0; }
      .wiz-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 50; }
      .wiz-modal { background: #252537; color: #e6e6f0; border: 1px solid #34344a; border-radius: 10px; padding: 1.2rem; width: 460px; max-width: 92vw; max-height: 90vh; overflow: auto; font-family: system-ui, sans-serif; }
      .wiz-modal h1 { font-size: 1.1rem; margin: 0 0 .8rem; }
      .wiz-field { margin-bottom: .7rem; }
      .wiz-field-label { font-size: .78rem; color: #9a9ab0; margin-bottom: .25rem; }
      .wiz-input, .wiz-csv { width: 100%; background: #15151f; color: #e6e6f0; border: 1px solid #34344a; border-radius: 6px; padding: .35rem; font: inherit; box-sizing: border-box; }
      .wiz-csv { font-family: ui-monospace, monospace; font-size: 12px; }
      .wiz-twin { display: flex; gap: .5rem; }
      .wiz-twin > * { flex: 1; }
      .wiz-error { color: #ff8a8a; font-size: .8rem; margin: -.4rem 0 .6rem; }
      .wiz-actions { display: flex; justify-content: flex-end; gap: .5rem; margin-top: 1rem; }
      .wiz-actions button { font: inherit; color: #e6e6f0; background: #2f2f44; border: 1px solid #34344a; border-radius: 6px; padding: .35rem .8rem; cursor: pointer; }
      .wiz-actions button:hover { border-color: #7c5cff; }
      .wiz-primary { background: #7c5cff !important; border-color: #7c5cff !important; color: #fff; }
      .wiz-actions button[disabled] { opacity: .45; cursor: not-allowed; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="app.js"></script>
    <script>
      // The compiled app exposes its ports on window.$app (the elm-lang JS backend). On each spec it
      // emits, render it with vega-embed into the #vis element the app created (kept stable by lazy).
      // The shell may mount a tick after this script runs, so poll briefly until the port exists; any
      // spec emitted before we subscribe is buffered by the runtime and flushed on subscribe.
      (function wire() {
        if (!window.$app || !window.$app.ports || !window.$app.ports.renderSpec) {
          setTimeout(wire, 30);
          return;
        }
        window.$app.ports.renderSpec.subscribe(function (json) {
          var el = document.getElementById("vis");
          if (!el || !json) return;
          var spec;
          try { spec = JSON.parse(json); } catch (e) { return; }
          vegaEmbed(el, spec, { actions: true, renderer: "svg" }).catch(function (e) {
            el.innerHTML = '<pre class="vega-err">' + String(e) + "</pre>";
          });
        });
      })();
    </script>
  </body>
</html>
